<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video door</title>
<!--
  The door. A notebook opened straight from disk (a double-clicked .html) cannot play
  YouTube, because YouTube refuses any embed that arrives without a web address as its
  Referer (its "Error 153", enforced since 2025), and a file has no address to send. This
  page HAS an address, so it holds the player, and the notebook frames this page and drives
  the player through postMessage. It is generic: ?v=<video id>, optional &start=<seconds>,
  &autoplay=1. It carries nothing about anyone and it is the same for every notebook.

  Messages in:  { door: "call", id, fn, args }      -> player[fn].apply(player, args); reply { door: "reply", id, value }
  Messages out: { door: "hello" }                     as soon as this page runs
                { door: "ready", duration }          once the player is ready
                { door: "state", t, st, dur, rate, vol, muted }   every 100ms while ready (the parent's clock)
                { door: "event", name, data }        onStateChange / onApiChange / onError
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Plyr's crop, as the notebook draws it: YouTube's frame is 240% as tall as the picture
     and centred, so its title, "more videos" and watermark fall outside this box. */
  #yt { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
  #yt iframe { position: absolute; left: 0; width: 100%; height: 240%; top: -70%; border: 0; }
</style>
</head>
<body>
<div id="yt"><div id="target"></div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search), id = q.get("v"), start = +q.get("start") || 0, autoplay = q.get("autoplay") === "1";
  if (!/^[A-Za-z0-9_-]{6,20}$/.test(id || "")) { document.body.textContent = "No video."; return; }
  var player = null, ready = false;
  function send(m) { try { parent.postMessage(m, "*"); } catch (e) {} }
  function state() {
    try { return { door: "state", t: player.getCurrentTime() || 0, st: player.getPlayerState(), dur: player.getDuration() || 0, rate: (player.getPlaybackRate && player.getPlaybackRate()) || 1, vol: player.getVolume(), muted: player.isMuted() }; }
    catch (e) { return null; }
  }
  window.addEventListener("message", function (e) {
    var m = e.data; if (!m || m.door !== "call" || !player || !ready) return;
    var value;
    try { value = typeof player[m.fn] === "function" ? player[m.fn].apply(player, m.args || []) : undefined; } catch (err) { value = undefined; }
    if (m.id != null) send({ door: "reply", id: m.id, value: value === undefined ? null : value });
  });
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("target", {
      videoId: id, host: "https://www.youtube-nocookie.com",
      playerVars: { rel: 0, playsinline: 1, fs: 0, controls: 0, iv_load_policy: 3, autoplay: autoplay ? 1 : 0, start: Math.floor(start), origin: location.origin },
      events: {
        onReady: function () { ready = true; var f = document.querySelector("#yt iframe"); if (f) f.removeAttribute("allowfullscreen"); send({ door: "ready", duration: player.getDuration() || 0 }); setInterval(function () { var s = state(); if (s) send(s); }, 100); },
        onStateChange: function (ev) { send({ door: "event", name: "onStateChange", data: ev.data }); var s = state(); if (s) send(s); },
        onApiChange: function () { send({ door: "event", name: "onApiChange" }); },
        onError: function (ev) { send({ door: "event", name: "onError", data: ev.data }); }
      }
    });
  };
  send({ door: "hello" });   // the door has opened; the player follows once YouTube answers
  var s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
})();
</script>
</body>
</html>
